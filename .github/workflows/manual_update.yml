name: Manual Update

on:
  workflow_dispatch:
    inputs:
      prefecture:
        description: '都道府県コード（01〜47）または都道府県名（空欄は全国）'
        required: false
        default: ''
        type: string
      update_boundary:
        description: '境界データ（boundary.json）を更新する'
        required: false
        default: false
        type: boolean
      update_city:
        description: '市区町村境界データ（cityAndSuburb.json）を更新する'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Run Main Method
        env:
          TARGET_PREFECTURE: ${{ inputs.prefecture }}
          UPDATE_BOUNDARY: ${{ inputs.update_boundary }}
          UPDATE_CITY: ${{ inputs.update_city }}
        run: |
          ARGS=""
          if [ "$UPDATE_BOUNDARY" = "true" ]; then
            ARGS="--boundary"
          fi
          if [ "$UPDATE_CITY" = "true" ]; then
            ARGS="$ARGS --city"
          fi
          if [ -n "$TARGET_PREFECTURE" ]; then
            ARGS="$ARGS $TARGET_PREFECTURE"
          fi
          mvn compile exec:java -Dexec.args="$ARGS"

      - name: Checkout gh-pages
        uses: actions/checkout@v7.0.0
        with:
          ref: gh-pages
          path: gh-pages

      - name: Sync generated files
        run: |
          mkdir -p gh-pages/pages
          rsync -av pages/ gh-pages/pages/

      - name: Commit and Push
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet || git commit -m "Manual update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/pages
          
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    permissions:
      pages: write
      id-token: write 
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
